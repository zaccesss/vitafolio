; uploads: the largest file is a 25 MB video, plus room for the rest of the form
upload_max_filesize = 26M
post_max_size = 28M
memory_limit = 256M
max_execution_time = 60
expose_php = Off

; nothing runs a shell command through these. proc_open stays, because the pdf renderer needs it
disable_functions = exec,shell_exec,passthru,system,popen,pcntl_exec,dl,show_source,phpinfo
; every outside request goes through the http client, so php never has to open a url as a file
allow_url_fopen = Off
allow_url_include = Off

; the code never changes inside a running container, so opcache never needs to check files
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

; laravel keeps its own sessions and nothing reads php's upload progress, so php never writes native session data during an upload
session.upload_progress.enabled = 0
