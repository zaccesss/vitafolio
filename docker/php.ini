; uploads: the largest file is a 25 MB video, plus room for the rest of the form
upload_max_filesize = 26M
post_max_size = 28M
memory_limit = 256M
max_execution_time = 60
expose_php = Off

; the code never changes inside a running container, so opcache never needs to check files
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
