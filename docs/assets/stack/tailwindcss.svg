<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="t">
  <title id="t">Tailwind CSS</title>
  <style>
    .logo { animation: bob 3s ease-in-out -2.25s infinite; transform-origin: 48px 48px; }
