# community translation through crowdin. english is the source. the crowdin sync workflow uploads new
# english strings and opens a pull request with new translations from the l10n_crowdin branch. the
# project id and token come from the environment, never this file; see "Community translation" in
# docs/DOCUMENTATION.md. the build never needs crowdin
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
preserve_hierarchy: true
commit_message: 'chore: update %language% translations'
append_commit_message: false

files:
  # interface strings, keyed by their english text
  - source: /lang/en.json
    translation: /lang/%two_letters_code%.json
    languages_mapping: &mapping
      two_letters_code:
        zh-CN: zh_CN
        pt-BR: pt_BR
  # framework messages: validation, sign-in, password reset and pagination
  - source: /lang/en/*.php
    translation: /lang/%two_letters_code%/%original_file_name%
    languages_mapping: *mapping
