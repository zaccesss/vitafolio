name: Something is wrong
description: A page, a form, a file or a sign-in does not work as it should
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Leave out personal details such as your email address or the contents of a private CV.
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: "e.g. the CV editor's Projects tab, the LaTeX editor, signing in with GitHub"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Select...\n3. See..."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "e.g. Firefox 140 on Windows 11, Safari on iPhone"
