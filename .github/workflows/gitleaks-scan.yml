# scan the repository for hard-coded secrets and credentials on every push to main
# and on every PR targeting main. A pinned gitleaks binary is installed directly to
# avoid the action wrapper that requires a paid licence for SARIF upload on private repos.

name: Gitleaks Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# least-privilege token - read-only access to repository contents.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # check out the repository content for scanning.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # install a pinned gitleaks binary directly - avoids the action wrapper
      # which requires a paid licence for SARIF upload on private repos.
      # the download retries on any error because GitHub's release server occasionally answers 500, which
      # used to fail the whole check before a single file was scanned. It is saved to a file first so a
      # half finished download is never piped into tar.
      - name: Install Gitleaks
        run: |
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      # scan working tree files only (--no-git) for hard-coded credentials.
      # exits with code 1 if any leak is found, failing the workflow.
      - name: Run Gitleaks
        run: gitleaks detect --no-git --redact --exit-code=1
