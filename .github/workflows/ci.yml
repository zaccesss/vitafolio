name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: gd, intl, zip, bcmath, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # the tagged pdf tests run the same typst release as the production image, checked against its published digest
      - name: Install typst
        run: |
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  /tmp/typst.tar.xz" | sha256sum -c -
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      # the chinese pdf font is fetched rather than kept in git, the same way the docker build does it
      - name: Fetch the pdf fonts
        run: sh scripts/fetch-pdf-fonts.sh

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Known vulnerabilities in PHP packages
        run: composer audit --no-dev

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests
        run: php artisan test

  assets:
    name: Front-end build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Known vulnerabilities in npm packages
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # built but never pushed: the host builds its own image from the repository
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: vitafolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the pdf renderer runs in the image
        run: docker run --rm --entrypoint typst vitafolio:ci --version

      # fails on a known critical or high vulnerability that has a fix; unfixed ones are reported only
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vitafolio:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
