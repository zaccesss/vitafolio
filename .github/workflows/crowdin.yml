name: Crowdin sync

# keeps the interface translations in step with Crowdin. A change to the english strings on main is
# uploaded straight away; translations made on Crowdin come back as one pull request from the
# l10n_crowdin branch, checked daily. It needs the CROWDIN_PERSONAL_TOKEN secret and the
# CROWDIN_PROJECT_ID variable; without them the job stops before doing anything. The pull request is
# opened with the automation account's token (CROWDIN_BOT_TOKEN), so it is credited to that account
# and its CI checks start on their own, which a pull request from the built-in token never does.
# Translations committed to the repository never reach Crowdin on their own, so its next download would
# write english back over them. A manual run with upload_translations sends them up first; scheduled
# and push runs never do, so work done by translators on Crowdin is not overwritten.

permissions: {}

on:
  push:
    branches: [main]
    paths:
      - "lang/en.json"
      - "lang/en/**"
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      upload_translations:
        description: "Also upload the translations committed to this repository"
        type: boolean
        default: false

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  sync:
    name: Sync with Crowdin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check the Crowdin settings
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
          CROWDIN_BOT_TOKEN: ${{ secrets.CROWDIN_BOT_TOKEN }}
        run: |
          if [ -z "$CROWDIN_PERSONAL_TOKEN" ] || [ -z "$CROWDIN_PROJECT_ID" ] || [ -z "$CROWDIN_BOT_TOKEN" ]; then
            echo "Crowdin is not configured, skipping"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload sources and download translations
        uses: crowdin/github-action@9c23991700c0ec5256fd41089b9d9d7d540e424e # v3.3.0
        with:
          upload_sources: true
          upload_translations: ${{ inputs.upload_translations || false }}
          download_translations: true
          localization_branch_name: l10n_crowdin
          create_pull_request: true
          pull_request_title: "chore: update translations from Crowdin"
          pull_request_body: "New and updated interface translations from the Vitafolio project on Crowdin."
          pull_request_labels: "chore"
          pull_request_base_branch_name: main
          commit_message: "chore: update translations from Crowdin"
          github_user_name: Zac Bot
          github_user_email: automation@isaacadjei.me
        env:
          GITHUB_TOKEN: ${{ secrets.CROWDIN_BOT_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ vars.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
